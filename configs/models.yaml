# FairEval ECIR 2027 model manifest
# Verified against official provider documentation on 2026-09-15.
#
# This is a PRE-RUN manifest. Do not silently change model IDs after the pilot
# freeze. If an alias can move, record the resolved/version metadata returned or
# documented by the provider and prefer an immutable snapshot when one exists.

models:
  - family: openai
    name: gpt-5.6-terra
    model_id: gpt-5.6-terra
    api_key_env: OPENAI_API_KEY
    enabled: true
    reasoning_or_thinking_setting: none
    sampling_policy: explicit_low_variance_where_supported
    verification: official_openai_models_2026-09-15
    notes: >-
      Cost-balanced GPT-5.6 family model. FairEval requests reasoning_effort=none.
      Do not replace with Sol/Luna after inspecting results; a model change
      requires a new experiment version.

  - family: anthropic
    name: claude-sonnet-5
    model_id: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    enabled: true
    reasoning_or_thinking_setting: disabled
    sampling_policy: provider_default_sampling_controls_deprecated
    verification: official_anthropic_active_models_2026-09-15
    notes: >-
      Active Claude model. Sonnet 5 defaults to adaptive thinking, so FairEval
      explicitly sends thinking={type: disabled}. Non-default temperature/top_p/
      top_k are rejected on this generation, therefore the adapter omits them and
      logs that provider-default sampling was applied.

  - family: google
    name: gemini-3.8-flash
    model_id: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    enabled: true
    reasoning_or_thinking_setting: low
    sampling_policy: provider_default_sampling_controls_deprecated
    verification: official_gemini_models_2026-09-15
    notes: >-
      Stable Gemini API model. Gemini 3.8 Flash supports thinking levels low,
      medium, and high but not a full off/minimal mode. FairEval freezes the
      lowest supported level, low. Temperature/top_p/top_k are deprecated on
      3.8 Flash and are omitted; structured output uses the Interactions API.

  - family: deepseek
    name: deepseek-v4.1-flash
    model_id: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    enabled: true
    reasoning_or_thinking_setting: disabled
    sampling_policy: explicit_low_variance_where_supported
    verification: official_deepseek_api_2026-09-15
    notes: >-
      Current DeepSeek API model name for DeepSeek V4.1 Flash. FairEval explicitly
      sends thinking={type: disabled}, making requested temperature/top_p active.
      The former deepseek-v4-flash model is retired and its legacy alias is
      temporarily routed to V4.1 Flash. Record request date and returned backend
      metadata because deepseek-flash is not an immutable snapshot.

  - family: qwen
    name: qwen3.8-max-0902
    model_id: qwen3.8-max-0902
    api_key_env: DASHSCOPE_API_KEY
    enabled: true
    reasoning_or_thinking_setting: disabled
    sampling_policy: explicit_low_variance_where_supported
    verification: alibaba_model_studio_2026-09-15
    notes: >-
      Immutable dated Qwen3.8-Max snapshot released 2026-09-02. Qwen 3.8 models
      default to thinking enabled, so FairEval explicitly sends
      enable_thinking=false. Freeze the exact Model Studio region/endpoint.

  - family: meta
    name: llama-4-maverick
    model_id: meta-llama/Llama-4-Maverick-17B-128E-Instruct
    api_key_env: LLAMA_PROVIDER_API_KEY
    enabled: true
    reasoning_or_thinking_setting: not_applicable
    sampling_policy: explicit_low_variance_where_supported
    provider: null
    verification: official_meta_llama_2026-09-15
    notes: >-
      The Meta checkpoint identity is static, but the serving provider is not
      frozen yet. Pin the exact hosted checkpoint/revision and provider endpoint
      before pilot freeze. Never use an unversioned moving provider alias for the
      final comparison.

generation:
  top_k: 10
  max_output_tokens: 512

  # Requested audit profile. Adapters record whether controls are actually
  # supported/applied; provider defaults are used where the API deprecates them.
  temperature_main_requested: 0.2
  top_p_main_requested: 1.0
  main_repetitions: 3

  # Focused RQ3 audit. For providers without explicit sampling controls, repeated
  # generations quantify stochasticity under the frozen provider-default policy.
  temperature_stochasticity_requested: 0.7
  top_p_stochasticity_requested: 1.0
  stochasticity_repetitions: 10
  stochasticity_fraction: 0.10

  structured_output: true
  request_chain_of_thought: false
  cross_provider_decoding_equivalence_claimed: false
  deliberation_policy: >-
    Use the lowest supported deliberation mode appropriate for direct ranking:
    OpenAI none, Claude disabled, Gemini low, DeepSeek disabled, Qwen disabled,
    and no added reasoning wrapper for Llama.

reproducibility_required_fields:
  - provider
  - provider_region
  - model_family
  - requested_model_id
  - resolved_model_version
  - request_utc
  - temperature_requested
  - top_p_requested
  - sampling_controls_applied
  - sampling_policy
  - max_output_tokens
  - reasoning_or_thinking_setting
  - seed_requested
  - seed_supported
  - prompt_template_id
  - prompt_mode
  - candidate_order_seed
  - prompt_sha256
  - request_sha256
  - response_sha256
  - code_commit_sha
