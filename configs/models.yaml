# FairEval ECIR 2027 hosted/API model manifest
# Gateway execution freeze updated 2026-09-17 for Zhizengzeng.
#
# This manifest is PRE-RUN. Model IDs are frozen before any paid confirmatory
# execution. The live /v1/models preflight remains mandatory on the user's key;
# if a frozen ID is absent, do not silently substitute a model after inspecting
# results. Create a new experiment version instead.

hosted_gateway:
  name: zhizengzeng
  base_url_env: ZZZ_BASE_URL
  api_key_env: ZZZ_API_KEY
  default_base_url: https://api.zhizengzeng.com/v1
  interface: openai_compatible_chat_completions
  balance_endpoint: /dashboard/billing/credit_grants
  budget_config: configs/hosted_budget.yaml

models:
  - family: openai
    name: gpt-5.6-terra
    model_id: gpt-5.6-terra
    api_key_env: ZZZ_API_KEY
    enabled: true
    provider: zhizengzeng
    reasoning_or_thinking_setting: none
    sampling_policy: explicit_low_variance_where_supported
    output_token_parameter: max_completion_tokens
    verification: zhizengzeng_public_catalog_2026-09-17_plus_live_models_preflight_required
    notes: >-
      Gateway catalog lists GPT-5.6 Terra. FairEval uses the gateway's
      OpenAI-compatible endpoint. The resolved model string returned by the
      service, request timestamp, and gateway provenance are logged.

  - family: anthropic
    name: claude-sonnet-5
    model_id: claude-sonnet-5
    api_key_env: ZZZ_API_KEY
    enabled: true
    provider: zhizengzeng
    reasoning_or_thinking_setting: disabled_requested_at_study_level
    sampling_policy: gateway_openai_compatible_low_variance_request
    output_token_parameter: max_tokens
    verification: zhizengzeng_public_catalog_2026-09-17_plus_live_models_preflight_required
    notes: >-
      Gateway catalog lists Claude Sonnet 5. Because this execution uses the
      common OpenAI-compatible gateway path rather than Anthropic's native API,
      FairEval does not claim native serving-stack equivalence. Requested
      deliberation policy and returned serving metadata are logged separately.

  - family: google
    name: gemini-3.8-flash
    model_id: gemini-3.8-flash
    api_key_env: ZZZ_API_KEY
    enabled: true
    provider: zhizengzeng
    reasoning_or_thinking_setting: low_requested_at_study_level
    sampling_policy: gateway_openai_compatible_low_variance_request
    output_token_parameter: max_tokens
    verification: zhizengzeng_public_catalog_2026-09-17_plus_live_models_preflight_required
    notes: >-
      Gateway catalog lists Gemini 3.8 Flash. The gateway OpenAI-compatible path
      uses max_tokens semantics, so the plan freezes that field instead of the
      native Gemini max_output_tokens field. No native-API equivalence claim is
      made.

  - family: deepseek
    name: deepseek-v4.1-flash
    model_id: deepseek-v4.1-flash
    api_key_env: ZZZ_API_KEY
    enabled: true
    provider: zhizengzeng
    reasoning_or_thinking_setting: disabled_requested_at_study_level
    sampling_policy: gateway_openai_compatible_low_variance_request
    output_token_parameter: max_tokens
    verification: zhizengzeng_public_catalog_2026-09-17_plus_live_models_preflight_required
    notes: >-
      Gateway catalog explicitly lists DeepSeek V4.1 Flash. Use the explicit
      v4.1 identifier rather than the moving deepseek-flash alias so the paper
      and execution manifest describe the same checkpoint family.

  - family: qwen
    name: qwen3.8-2.4t-a95b
    model_id: qwen3.8-2.4t-a95b
    api_key_env: ZZZ_API_KEY
    enabled: true
    provider: zhizengzeng
    reasoning_or_thinking_setting: disabled_requested_at_study_level
    sampling_policy: gateway_openai_compatible_low_variance_request
    output_token_parameter: max_tokens
    verification: zhizengzeng_public_catalog_2026-09-17_plus_live_models_preflight_required
    notes: >-
      The previous pre-run label qwen3.8-max-0902 was not retained. The current
      gateway catalog lists qwen3.8-2.4t-a95b; that exact gateway ID is frozen for
      the hosted panel, subject to live /v1/models confirmation on the experiment
      key before paid execution.

  - family: meta
    name: llama-4-maverick
    model_id: llama-4-maverick
    api_key_env: ZZZ_API_KEY
    enabled: true
    provider: zhizengzeng
    reasoning_or_thinking_setting: not_applicable
    sampling_policy: gateway_openai_compatible_low_variance_request
    output_token_parameter: max_tokens
    verification: zhizengzeng_public_catalog_2026-09-17_plus_live_models_preflight_required
    notes: >-
      Gateway catalog lists llama-4-maverick directly. The previously unresolved
      Llama hosting-provider blocker is therefore replaced by the explicit
      Zhizengzeng gateway provenance, while returned model metadata remains part
      of every request record.

generation:
  top_k: 10
  max_output_tokens: 512
  temperature_main_requested: 0.2
  top_p_main_requested: 1.0
  main_repetitions: 3
  temperature_stochasticity_requested: 0.7
  top_p_stochasticity_requested: 1.0
  stochasticity_repetitions: 10
  stochasticity_fraction: 0.10
  structured_output: true
  request_chain_of_thought: false
  cross_provider_decoding_equivalence_claimed: false
  deliberation_policy: >-
    Direct-ranking prompts request the lowest practical deliberation behavior,
    but the common gateway path is not claimed to reproduce each vendor's native
    API control surface exactly. FairEval logs the requested policy, gateway
    provider, returned model/version string, sampling controls, and timestamps.

budget:
  config: configs/hosted_budget.yaml
  planning_target_rmb: 200.0
  hard_cap_rmb: 250.0
  per_request_reserve_rmb: 2.0
  source_of_record: gateway_balance_delta

reproducibility_required_fields:
  - provider
  - provider_region
  - model_family
  - requested_model_id
  - resolved_model_version
  - request_utc
  - temperature_requested
  - top_p_requested
  - sampling_controls_applied
  - sampling_policy
  - output_token_parameter
  - max_output_tokens
  - reasoning_or_thinking_setting
  - seed_requested
  - seed_supported
  - prompt_template_id
  - prompt_mode
  - candidate_order_seed
  - prompt_sha256
  - request_sha256
  - response_sha256
  - code_commit_sha
