# High-level experiment contract. `configs/study_design.yaml` is authoritative.
# The `tracks` section remains exactly the six real-world core datasets for
# backwards compatibility with the frozen core planner. New local/synthetic work
# is isolated under `extension_tracks`.

study:
  name: faireval_ecir2027
  primary_k: 10
  sensitivity_k: [5, 10, 20]
  users_per_dataset_target: 100
  candidate_set_size: 50
  max_history_items: 20
  main_repetitions: 3
  stochasticity_subset_fraction: 0.10
  stochasticity_repetitions: 10
  hosted_core_models: 6
  local_open_weight_models: 2
  real_world_core_datasets: 6
  auxiliary_synthetic_datasets: 1

prompt_design:
  protocol_config: configs/prompt_suite.yaml
  cue_config: configs/cue_suite.yaml
  primary_template: field_v2_a
  primary_mode: audit
  primary_cue: structured_key_value
  candidate_order_policy: deterministic_per_user_frozen_seed
  paired_conditions_share_candidate_order: true
  fairness_coaching_in_primary_audit: false
  mitigation_modes:
    - identity_irrelevance
  paired_counterfactual_invariant_check: true

tracks:
  personality_grounded:
    datasets:
      - personality2018
      - music_master_bfi2
      - reasoner
    core_conditions: [C0, C3, C4]
    users_per_dataset: 100
    repetitions: 3
    shuffled_profile_control:
      method: deterministic_whole_profile_derangement
      preserves_multivariate_distribution: true
      preserves_trait_covariance: true
    one_trait_subset:
      condition: C5
      users_per_dataset: 30
      dimensions: [openness, conscientiousness, extraversion, agreeableness, neuroticism]
      donor_policy: deterministic_distant_observed_value
      fabricate_scale_extremes: false
      repetitions: 3

  demographic_counterfactual:
    datasets:
      - movielens_1m
      - lastfm_1k
    core_conditions: [C0, C1, C2]
    users_per_dataset: 100
    repetitions: 3
    primary_attributes:
      movielens_1m: [gender]
      lastfm_1k: [gender]
    robustness_attributes:
      movielens_1m: [age_group]
      lastfm_1k: [age_group]
    intersectional_subset:
      condition: C6
      enabled_in_core_plan: false
      reason: not_generated_by_current_frozen_core_planner

  generalization_only:
    datasets:
      - mind
    users_per_dataset: 50
    core_conditions: [C0]
    repetitions: 3
    observed_demographic_claims_allowed: false
    synthetic_identity_in_core_plan: false

extension_tracks:
  local_open_weight_transparency:
    config: configs/local_models.yaml
    families: [qwen25_local, phi35_local]
    model_ids:
      qwen25_local: Qwen/Qwen2.5-7B-Instruct
      phi35_local: microsoft/Phi-3.5-mini-instruct
    execute_core_real_world_tasks: true
    local_internal_diagnostics: true
    internal_diagnostics_are_calibrated_uncertainty: false
    exact_huggingface_revision_required_before_pilot: true
    preferred_gpu: NVIDIA_GeForce_RTX_5070_Ti_16GB
    quantization_policy: bitsandbytes_nf4_4bit
    compute_dtype: bfloat16
    load_models_concurrently: false

  fairsynth360:
    config: configs/fairsynth360.yaml
    dataset: fairsynth360
    users: 360
    external_data_used: false
    identity_groups: [A, B, C]
    identity_independent_of_relevance: true
    synthetic_ocean_is_human_measurement: false
    full_run_models: [qwen25_local, phi35_local]
    core_conditions: [C0, C1, C2, C3, C4]
    repetitions: 3
    report_separately_from_real_world: true
    never_pool_with_real_demographic_or_psychometric_inference: true

conditions:
  - id: C0
    name: preference_only
    demographics: unspecified
    personality: unspecified
  - id: C1
    name: observed_demographic
    demographics: observed_if_available
    personality: unspecified
  - id: C2
    name: counterfactual_demographic
    demographics: paired_counterfactual
    personality: unspecified
  - id: C3
    name: true_personality
    demographics: unspecified
    personality: measured_ocean_for_real_datasets_or_synthetic_ocean_for_fairsynth
  - id: C4
    name: shuffled_personality
    demographics: unspecified
    personality: deterministic_whole_profile_derangement
  - id: C5
    name: one_trait_counterfactual
    demographics: unspecified
    personality: one_observed_ocean_dimension_intervened
  - id: C6
    name: intersectional_reserved
    enabled_in_core_plan: false
    demographics: reserved_for_separate_versioned_plan
    personality: unspecified

robustness:
  design: one_factor_at_a_time_on_frozen_subsets
  never_cross_all_robustness_factors: true
  task_paraphrase:
    users_per_dataset: 20
    datasets: all_six_real_world
    representative_conditions_per_dataset: 2
    templates: [field_v2_a, field_v2_b, field_v2_c]
    repetitions: 1
  demographic_cue:
    users_per_dataset: 20
    datasets: [movielens_1m, lastfm_1k]
    representative_conditions: [C1, C2]
    cues: [structured_key_value, first_person_explicit, third_person_profile]
    repetitions: 1
  candidate_order:
    users_per_dataset: 20
    datasets: all_six_real_world
    representative_conditions_per_dataset: 2
    order_seeds: [1729, 2718, 31415]
    repetitions: 1
  cutoff:
    users_per_dataset: 20
    datasets: all_six_real_world
    representative_conditions_per_dataset: 2
    k_values: [5, 10, 20]
    repetitions: 1
  stochasticity:
    users_per_dataset: 10
    datasets: all_six_real_world
    representative_conditions_per_dataset: 2
    repetitions: 10
    temperature_requested_where_supported: 0.7
    provider_default_where_sampling_controls_deprecated: true

rq4:
  demographic_datasets: [movielens_1m, lastfm_1k]
  users_per_dataset: 50
  reuse_unmitigated_core_runs: true
  extra_api_modes: [identity_irrelevance]
  extra_repetitions: 3
  postprocessing_methods: [contextual_pair_reranker]
  pair_minimum_identity_rankings: 2
  pair_alpha_grid: [0.25, 0.5, 0.75]
  pair_lambda_grid: [0.0, 0.05, 0.1, 0.2, 0.4, 0.8, 1.6]
  pair_hyperparameters_selected_on_validation_only: true
  report_pareto_frontier: true
  preserve_personality_value_check_reuses_rq2_runs: true

metrics:
  utility_primary: [ndcg, recall]
  utility_secondary: [mrr]
  behavioral_shift: [jaccard, rbo]
  fairness:
    - counterfactual_utility_gap
    - group_utility_disparity
    - counterfactual_exposure_gap_complete_metadata_only
    - invalid_output_disparity
  exposure_metadata:
    require_complete_top_k_for_primary: true
    report_metadata_coverage: true
    partial_metadata_analysis_is_exploratory: true
  personality: [personality_value_added]
  robustness:
    - template_variance
    - cue_variance
    - candidate_order_variance
    - cutoff_variance
    - generation_variance
  local_white_box_auxiliary:
    - mean_generated_token_logprob
    - generated_token_nll
    - generated_token_perplexity
    - mean_top1_top2_logit_margin
  legacy_sensitivity_only: [pafs_original]

statistics:
  confidence_level: 0.95
  paired_bootstrap_samples: 10000
  multiple_comparison_correction: holm
  primary_unit: user
  primary_test: paired_permutation
  sensitivity_tests: [wilcoxon_signed_rank]
  report_effect_sizes: true
  mixed_effects_if_supported: true
  nuisance_factors:
    - prompt_template
    - demographic_cue
    - candidate_order_seed
    - generation_repetition
  local_white_box_statistics_are_exploratory: true
  fairsynth_inference_is_separate_from_real_world: true

output_policy:
  strict_json: true
  require_exact_k_unique_ids: true
  require_candidate_membership: true
  request_explanations: false
  request_chain_of_thought: false
  max_format_repair_attempts: 1
  format_repair_may_change_ranking: false
  keep_persistent_failures: true
  never_silently_drop_failures: true

provider_policy:
  requested_main_temperature: 0.2
  requested_main_top_p: 1.0
  exact_cross_provider_sampling_equivalence_claimed: false
  lowest_supported_deliberation:
    openai: none
    anthropic: disabled
    google: low
    deepseek: disabled
    qwen: disabled
    meta: no_added_reasoning_wrapper
    qwen25_local: not_applicable
    phi35_local: not_applicable
  sampling_controls:
    anthropic: provider_default_current_api
    google: provider_default_current_api
    openai: explicit_where_supported
    deepseek: explicit_with_thinking_disabled
    qwen: explicit_with_thinking_disabled
    meta: provider_specific_freeze_required
    qwen25_local: explicit_local_seeded
    phi35_local: explicit_local_seeded

analysis_policy:
  lock_splits_before_api_calls: true
  lock_prompts_before_main_run: true
  lock_primary_prompt_before_main_run: true
  lock_model_panel_before_main_run: true
  lock_local_model_revisions_before_local_run: true
  lock_provider_endpoints_before_main_run: true
  no_post_hoc_prompt_selection: true
  no_post_hoc_attribute_selection: true
  no_manual_paper_numbers: true
  generate_tables_from_results: true
  generate_figures_from_results: true
  do_not_replace_failed_generations_after_outcome_inspection: true
  separate_real_synthetic_and_hosted_local_claims: true
