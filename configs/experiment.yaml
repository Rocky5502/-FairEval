study:
  name: faireval_ecir2027
  primary_k: 10
  sensitivity_k: [5, 10, 20]
  users_per_dataset_target: 100
  candidate_set_size: 50
  max_history_items: 20
  main_repetitions: 3
  stochasticity_subset_fraction: 0.10
  stochasticity_repetitions: 10

prompt_design:
  protocol_config: configs/prompt_suite.yaml
  cue_config: configs/cue_suite.yaml
  primary_template: field_v2_a
  primary_mode: audit
  primary_cue: structured_key_value
  candidate_order_policy: deterministic_per_user
  paired_conditions_share_candidate_order: true
  fairness_coaching_in_primary_audit: false
  mitigation_modes:
    - identity_irrelevance
  paired_counterfactual_invariant_check: true

tracks:
  personality_grounded:
    datasets:
      - personality2018
      - music_master_bfi2
      - reasoner
    core_conditions: [C0, C3, C4]
    users_per_dataset: 100
    repetitions: 3
    one_trait_subset:
      condition: C5
      users_per_dataset: 30
      dimensions: [openness, conscientiousness, extraversion, agreeableness, neuroticism]
      repetitions: 3

  demographic_counterfactual:
    datasets:
      - movielens_1m
      - lastfm
    core_conditions: [C0, C1, C2]
    users_per_dataset: 100
    repetitions: 3
    primary_attributes: dataset_supported_and_pre_registered
    intersectional_subset:
      condition: C6
      enabled: true
      users_per_dataset: 30
      run_only_if_cell_support_is_adequate: true

  synthetic_stress_test:
    datasets:
      - mind
    users_per_dataset: 50
    conditions: [C0, C2]
    repetitions: 3
    observed_demographic_claims_allowed: false

conditions:
  - id: C0
    name: preference_only
    demographics: unspecified
    personality: unspecified

  - id: C1
    name: observed_demographic
    demographics: observed_if_available
    personality: unspecified

  - id: C2
    name: counterfactual_demographic
    demographics: paired_counterfactual
    personality: unspecified

  - id: C3
    name: true_personality
    demographics: unspecified
    personality: measured_ocean

  - id: C4
    name: shuffled_personality
    demographics: unspecified
    personality: shuffled_from_other_user

  - id: C5
    name: one_trait_counterfactual
    demographics: unspecified
    personality: one_ocean_dimension_intervened

  - id: C6
    name: intersectional
    demographics: observed_or_counterfactual
    personality: measured_ocean

robustness:
  design: one_factor_at_a_time_on_frozen_subsets
  never_cross_all_robustness_factors: true

  task_paraphrase:
    users_per_dataset: 20
    datasets: all_six
    representative_conditions_per_dataset: 2
    templates: [field_v2_a, field_v2_b, field_v2_c]
    repetitions: 1

  demographic_cue:
    users_per_dataset: 20
    datasets: [movielens_1m, lastfm]
    representative_conditions: [C1, C2]
    cues: [structured_key_value, first_person_explicit, third_person_profile]
    repetitions: 1

  candidate_order:
    users_per_dataset: 20
    datasets: all_six
    representative_conditions_per_dataset: 2
    order_seeds: [1729, 2718, 31415]
    repetitions: 1

  cutoff:
    users_per_dataset: 20
    datasets: all_six
    representative_conditions_per_dataset: 2
    k_values: [5, 10, 20]
    repetitions: 1

  stochasticity:
    users_per_dataset: 10
    datasets: all_six
    representative_conditions_per_dataset: 2
    repetitions: 10
    temperature: 0.7

rq4:
  demographic_datasets: [movielens_1m, lastfm]
  users_per_dataset: 50
  reuse_unmitigated_core_runs: true
  extra_api_modes: [identity_irrelevance]
  extra_repetitions: 3
  postprocessing_methods: [pair_reranker]
  pair_hyperparameters_selected_on_validation_only: true
  report_pareto_frontier: true
  preserve_personality_value_check_reuses_rq2_runs: true

metrics:
  utility_primary:
    - ndcg
    - recall
  utility_secondary:
    - mrr
  behavioral_shift:
    - jaccard
    - rbo
  fairness:
    - counterfactual_utility_gap
    - group_utility_disparity
    - counterfactual_exposure_gap
    - invalid_output_disparity
  personality:
    - personality_value_added
  robustness:
    - template_variance
    - cue_variance
    - candidate_order_variance
    - cutoff_variance
    - generation_variance
  legacy_sensitivity_only:
    - pafs_original

statistics:
  confidence_level: 0.95
  paired_bootstrap_samples: 10000
  multiple_comparison_correction: holm
  primary_unit: user
  tests:
    - paired_permutation
    - wilcoxon_signed_rank
  report_effect_sizes: true
  mixed_effects_if_supported: true
  nuisance_factors:
    - prompt_template
    - demographic_cue
    - candidate_order_seed
    - generation_repetition

output_policy:
  strict_json: true
  require_exact_k_unique_ids: true
  require_candidate_membership: true
  request_explanations: false
  request_chain_of_thought: false
  max_format_repair_attempts: 1
  keep_persistent_failures: true
  never_silently_drop_failures: true

analysis_policy:
  lock_splits_before_api_calls: true
  lock_prompts_before_main_run: true
  lock_primary_prompt_before_main_run: true
  lock_model_panel_before_main_run: true
  no_post_hoc_prompt_selection: true
  no_post_hoc_attribute_selection: true
  no_manual_paper_numbers: true
  generate_tables_from_results: true
  generate_figures_from_results: true
  do_not_replace_failed_generations_after_outcome_inspection: true
