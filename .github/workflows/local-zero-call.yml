name: Local Zero-Call Smoke

on:
  push:
    branches: [ecir-2027-redesign]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install zero-call environment
        run: python -m pip install -e '.[dev,analysis]'
      - name: FairSynth to local-plan zero-call smoke
        run: python scripts/zero_call_local_smoke.py --output results/smoke/local_zero_call_v1.json
      - name: Upload zero-call provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: FairEval-Local-Zero-Call
          path: results/smoke/local_zero_call_v1.json
          if-no-files-found: error
          retention-days: 14
