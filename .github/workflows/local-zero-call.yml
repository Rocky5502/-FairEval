name: Local Zero-Call Smoke

on:
  push:
    branches: [ecir-2027-redesign]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install zero-call environment
        run: python -m pip install -e '.[dev,analysis]'
      - name: Library-level FairSynth to local-plan smoke
        run: python scripts/zero_call_local_smoke.py --output results/smoke/local_zero_call_v1.json
      - name: Freeze tiny FairSynth smoke fixture through public CLI
        run: |
          faireval prepare \
            --dataset fairsynth360 \
            --raw-dir . \
            --output-dir data/frozen-smoke/fairsynth360 \
            --users 12 \
            --candidate-set-size 30 \
            --max-history-items 8 \
            --seed 1729
          faireval verify-freeze --output-dir data/frozen-smoke/fairsynth360
      - name: Compile local smoke plan through public CLI
        run: |
          faireval plan-local \
            --freeze-root data/frozen-smoke \
            --output-dir results/plans/local-zero-call \
            --fairsynth-users 12 \
            --repetitions 1 \
            --no-real-world
      - name: Dry-run local smoke plan through shared executor CLI
        run: |
          faireval execute-plan \
            --plan-dir results/plans/local-zero-call \
            --freeze-root data/frozen-smoke \
            --output-jsonl results/raw/local-zero-call.jsonl \
            --family qwen25_local \
            --max-cells 2 \
            > results/smoke/local_cli_dry_run.json
          grep -q '"api_calls_made": 0' results/smoke/local_cli_dry_run.json
          grep -q '"selected_pending_cells": 2' results/smoke/local_cli_dry_run.json
      - name: Build full zero-call pre-execution seal
        run: python scripts/build_preexecution_seal.py --output-dir results/preexecution/seal-v1
      - name: Verify seal invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/preexecution/seal-v1/PREEXECUTION_SEAL.json')
          s = json.loads(p.read_text())
          assert s['hosted_api_generation_calls_made'] == 0
          assert s['local_model_weights_loaded'] is False
          assert s['empirical_results_seen_or_inserted'] is False
          assert s['plans']['whitebox_core']['planned_cells'] == 12960
          assert s['plans']['hosted_fairsynth']['planned_cells'] == 12960
          print('pre-execution seal invariants: PASS')
          PY
      - name: Upload zero-call provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FairEval-Local-Zero-Call
          path: |
            results/smoke/local_zero_call_v1.json
            results/smoke/local_cli_dry_run.json
            results/plans/local-zero-call/plan_manifest.json
            results/preexecution/seal-v1/PREEXECUTION_SEAL.json
            results/preexecution/seal-v1/PREEXECUTION_SEAL.md
            results/preexecution/seal-v1/FairEval_ECIR2027_PreResult_Overleaf.zip
            results/preexecution/seal-v1/commands
          if-no-files-found: error
          retention-days: 14
