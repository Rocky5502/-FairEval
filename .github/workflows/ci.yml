name: CI

on:
  push:
    branches: [main, ecir-2027-redesign]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Lint critical package errors
        run: ruff check src tests --select E9,F63,F7,F82
