<line x1="26" y1="535" x2="1265" y2="535" stroke="#CBD5E1" stroke-width="2"/><text x="26" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#182235">Core principle: Δ ranking ≠ unfairness. Fairness claims require matched interventions + preference-conditioned consequence evidence + robustness.</text>
