<text x="48" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#182235">Same user task</text><text x="48" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#66758C">candidate-constrained top-K</text>
<text x="48" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#182235">Preference evidence</text><text x="48" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#66758C">same Hᵤ + candidates Cᵤ</text>
<rect x="46" y="326" width="198" height="72" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><text x="62" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#182235">Held-out relevance Yᵤ</text><text x="62" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#182235">A12 ★   B04 ★   D07 ★</text>
