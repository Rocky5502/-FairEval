<text x="830" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#182235">FairEval interpretation</text><text x="830" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#66758C">Sensitivity is not the verdict; consequence comes next.</text>
<rect x="830" y="192" width="176" height="74" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><text x="848" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#182235">1  Ranking change?</text><text x="848" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#6D28D9">RBO / Jaccard · diagnostic</text>
<rect x="1032" y="192" width="196" height="74" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><text x="1050" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#182235">2  Consequence</text><text x="1050" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#66758C">held-out U(R,Y) · CUG/PVA/IOD</text>
<rect x="830" y="286" width="398" height="54" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/><text x="850" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">Stable / low sensitivity</text>
<rect x="830" y="352" width="398" height="54" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="850" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#15803D">Personalization or harmless sensitivity</text>
