<title id="title">FairEval motivating example</title>
<desc id="desc">Matched recommendation contexts are compared first for ranking sensitivity and then for held-out consequence so ranking change is not automatically labeled unfair.</desc>
<rect width="1300" height="610" fill="#ffffff"/>
<text x="26" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#182235">Why recommendation change is not automatically unfair</text>
<text x="26" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#66758C">Fixed task + preference evidence → one matched context change → ranking sensitivity → held-out consequence</text>
