[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faireval"
version = "0.2.0.dev0"
description = "Preference-conditioned fairness evaluation for LLM-based recommendation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.scripts]
faireval = "faireval.cli:main"

[project.optional-dependencies]
analysis = [
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
providers = [
  "openai>=1.0",
  "anthropic>=0.40",
  "google-genai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
